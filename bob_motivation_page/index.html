<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobs Motivations-Power</title>
    <style>
        /* BASIS-STYLING (unverändert) */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e0cbe6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #6e4e77;
        }

        #bob-container {
            position: relative;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s;
        }

        #bob-container:active {
            transform: scale(0.98);
        }

        #bob-image {
            width: 200px;
            height: auto;
            display: block;
            /*border-radius: 15px;
            box-shadow: 0 4px 15px rgba(68, 3, 77, 0.2);*/
        }

        /* Gemeinsames Styling für fliegende Objekte */
        .motivation-content {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Spezifisch für Text */
        .motivation-text {
            font-size: 1em;
            font-weight: bold;
            color: #73537c;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: #eddef1d8;
            border: 3px solid #d3bbda;
            white-space: nowrap;
        }

        /* Spezifisch für fliegende Bilder */
        .motivation-img {
            width: 200px; /* Größe der fliegenden Bilder */
            height: auto;
            border-radius: 10px;
            border: 3px solid #d3bbda;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @keyframes fly-away {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1); 
                filter: blur(0px);
            }
            70% { 
                filter: blur(0px); 
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5);
                filter: blur(5px);
            }
        }

        .flying {
            animation: fly-away 8s ease-out forwards;
        }

        /* FEUERWERK-EFFEKT */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color);
            pointer-events: none;
            z-index: 20;
            animation: explode 5s cubic-bezier(0.1, 1, 0.8, 1) forwards;
        }

        @keyframes explode {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--p-dx), var(--p-dy)) scale(0); }
        }



        .design-stripe {
            position: fixed;
            left: 0;
            width: 100%;
            height: 20px; /* Dicke des Streifens */
            background: #6e4e77
            z-index: 100; /* Damit sie immer ganz oben liegen */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Position oben */
        .top {
            top: 0;
            border-bottom: 2px solid #73537c
        }

        /* Position unten */
        .bottom {
            bottom: 0;
            border-top: 2px solid #73537c
        }
    </style>
</head>
<body>
    <div class="design-stripe top"></div>
    <h1>BOB'S MOTIVATION SITE</h1>
    <p>Click Bob!</p>

    <div id="bob-container">
        <img id="bob-image" src="Bob_V2.gif" alt="Bob">
    </div>

    <div id="message-container"></div>

    <div class="design-stripe bottom"></div>

    <p> &hearts; </p>

    </div>
    <script>
        const bobContainer = document.getElementById('bob-container');
        const messageContainer = document.getElementById('message-container');
        
        // --- EINSTELLUNGEN ---
        const CHANCE_FOR_IMAGE = 0.5; //  Wahrscheinlichkeit für ein Bild
        
        const texts = [
            "Du bist nicht faul, du sparst nur Energie!",
            "Prokrastination ist auch eine Form von Zeitmanagement.",


            "Wie heißt das neue Kolophonium für Bratscher? - Harz IV.",
            "Was ist ein Bratscher in Salzsäure? - Ein gelöstes Problem!",
            "Sitzen zwei Bratscher in einer Kneipe – kommt ein Musiker herein.",
            "Was ist ein schneller Bratscher in der Wüste? - Eine Fata Morgana",
            "Was ist der Unterschied zwischen dem erste und dem letzten Pult der Bratschen? - Ein ganzer Ton!",


        ];

        const motivationImages = [
            "CatImage_1.png",
            "CatImage_2.png",
            "CatImage_3.png",
            "CatImage_4.png",
            "CatImage_5.png",
            "CatImage_6.png",
            "CatImage_7.png",
            "CatImage_8.png",
            "CatImage_9.png",
            "CatImage_10.png",
        ];

        function createFireworks(x, y) {
            const colors = ['#ab3cc7', '#ff17f7', '#ff69b4', '#be57fa', '#ff2f7b'];
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                const dx = (Math.random() - 0.5) * 300;
                const dy = (Math.random() - 0.5) * 300;
                particle.style.setProperty('--p-dx', `${dx}px`);
                particle.style.setProperty('--p-dy', `${dy}px`);
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 5000);
            }
        }

        bobContainer.addEventListener('click', () => {
            const bobRect = bobContainer.getBoundingClientRect();
            const centerX = bobRect.left + bobRect.width / 2;
            const centerY = bobRect.top + bobRect.height / 2;

            let newElement;
            const randomDecision = Math.random(); // Zahl zwischen 0 und 1

            // --- ENTSCHEIDUNG: BILD ODER TEXT ---
            if (randomDecision < CHANCE_FOR_IMAGE) {
                // Erstelle Bild
                newElement = document.createElement('img');
                const randomImg = motivationImages[Math.floor(Math.random() * motivationImages.length)];
                newElement.src = randomImg;
                newElement.classList.add('motivation-content', 'motivation-img');
            } else {
                // Erstelle Text
                newElement = document.createElement('div');
                const randomQuote = texts[Math.floor(Math.random() * texts.length)];
                newElement.textContent = randomQuote;
                newElement.classList.add('motivation-content', 'motivation-text');
            }

            // Positionierung
            newElement.style.left = `${centerX}px`;
            newElement.style.top = `${centerY - 50}px`;

            messageContainer.appendChild(newElement);
            createFireworks(centerX, centerY);

            // Animation
            const randomX = (Math.random() - 0.5) * 800;
            const randomY = (Math.random() - 0.5) * 800;
            newElement.style.setProperty('--dx', `${randomX}px`);
            newElement.style.setProperty('--dy', `${randomY}px`);
            
            requestAnimationFrame(() => {
                newElement.classList.add('flying');
            });

            setTimeout(() => newElement.remove(), 3000);
        });
    </script>
</body>
</html>
